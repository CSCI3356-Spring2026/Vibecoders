[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"listings/management/commands/*.py" = ["E501"]
"listings/migrations/*.py" = ["E501"]
"users/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
