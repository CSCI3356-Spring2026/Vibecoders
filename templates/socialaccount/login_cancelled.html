{% extends "auth/base.html" %}

{% block title %}Login Cancelled | Vibecoders{% endblock %}

{% block auth_panel %}
    <h1 class="auth-title">Login cancelled</h1>
    <div class="auth-actions">
        <a class="auth-google-btn" href="{% url 'users:login' %}">
            <span class="auth-google-mark">{% include "auth/google_mark.html" %}</span>
            <span>Try again</span>
        </a>
    </div>
{% endblock %}
