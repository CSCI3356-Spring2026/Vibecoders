{% extends "base.html" %}

{% block title %}Login Error | Vibecoders{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-5 col-lg-6 col-md-8">
                <div class="auth-panel">
                    <div class="p-4 p-md-5">
                        <div class="auth-kicker">Google sign-in</div>
                        <h1 class="auth-title">Login did not complete</h1>
                        <p class="auth-copy">There was a problem while trying to sign you in with Google. Start again from the BC login screen.</p>
                        <div class="auth-actions">
                            <a class="auth-google-btn" href="/users/login/">
                                <span class="auth-google-mark">G</span>
                                Return to sign in
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
