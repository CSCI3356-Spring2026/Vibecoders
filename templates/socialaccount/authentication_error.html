{% extends "auth/base.html" %}

{% block title %}Login Error | {{ site_product_name }}{% endblock %}

{% block auth_panel %}
    <h1 class="auth-title">Login did not complete</h1>
    <div class="auth-actions">
        <a class="auth-google-btn" href="{% url 'users:login' %}">
            <span class="auth-google-mark">{% include "auth/google_mark.html" %}</span>
            <span>Return to sign in</span>
        </a>
    </div>
{% endblock %}
