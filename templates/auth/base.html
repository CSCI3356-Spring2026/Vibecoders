{% extends "base.html" %}

{% block content %}
<section class="app-page">
    <div class="container">
        <div class="auth-layout">
            <div class="listing-panel auth-panel">
                <div class="auth-panel-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="auth-alert" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    {% block auth_panel %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
