{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card border-danger mx-auto" style="max-width: 500px;">
        <div class="card-body text-center">
            <h3 class="text-danger">Delete Listing?</h3>
            <p>Are you sure you want to delete <strong>"{{ object.title }}"</strong>? This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'listings:listing_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
