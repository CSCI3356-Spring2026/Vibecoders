<span class="user-avatar {{ size_class|default:'user-avatar-md' }}{% if extra_class %} {{ extra_class }}{% endif %}">
    {% if user.profile_image_url %}
        <img
            class="user-avatar-image"
            src="{{ user.profile_image_url }}"
            alt="{{ user.get_full_name|default:user.username }}"
        >
    {% else %}
        <span class="user-avatar-fallback">{{ user.avatar_initial }}</span>
    {% endif %}
</span>
